name: Windows Build

# Manual trigger: run from the Actions tab (or `gh workflow run build-windows.yml`)
# whenever a Windows build is needed for a release. Not run on every push,
# since it's slow (full JUCE compile) and only needed for release cuts.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the build to (e.g. v0.0.1). Leave blank to just upload as a workflow artifact."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release (VST3 + Standalone)
        run: cmake --build build --config Release --target ONYVerb_VST3 --target ONYVerb_Standalone -j 4

      - name: Run DSP unit tests
        run: |
          cmake --build build --config Release --target ONYVerbTests -j 4
          ctest --test-dir build -C Release --output-on-failure

      - name: Package VST3
        shell: pwsh
        run: |
          Compress-Archive -Path "build/ONYVerb_artefacts/Release/VST3/ONY Verb.vst3" -DestinationPath "ONY-Verb-VST3-Windows.zip"

      - name: Package Standalone
        shell: pwsh
        run: |
          Compress-Archive -Path "build/ONYVerb_artefacts/Release/Standalone/ONY Verb.exe" -DestinationPath "ONY-Verb-Standalone-Windows.zip"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ONY-Verb-Windows-build
          path: |
            ONY-Verb-VST3-Windows.zip
            ONY-Verb-Standalone-Windows.zip

      - name: Attach to GitHub Release
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.inputs.release_tag }}" ONY-Verb-VST3-Windows.zip ONY-Verb-Standalone-Windows.zip --clobber
